<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multipass Card Customizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
      font-weight: 400;
    }

    .tool-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 860px;
    }

    /* ── Canvas ─────────────────────────────── */
    #canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2a2a2a, 0 24px 60px rgba(0,0,0,0.7);
      flex-shrink: 0;
    }

    #card-canvas {
      display: block;
      cursor: grab;
      user-select: none;
    }
    #card-canvas:active { cursor: grabbing; }

    /* Placeholder shown before template upload */
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1a1a1a;
      pointer-events: none;
    }
    #placeholder svg { opacity: 0.25; }
    #placeholder span { font-size: 12px; letter-spacing: 0.15em; color: #444; text-transform: uppercase; }
    #placeholder.hidden { display: none; }

    /* ── Controls ───────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 270px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 18px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #262626; }
    .btn.secondary:hover { background: #333; }

    label.btn { display: block; }

    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 4px 0;
    }

    #extra-controls {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 16px;
      font-weight: 600;
      background: #1c1c1c;
      color: #f0f0f0;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="text"]::placeholder { color: #444; font-weight: 400; }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-row label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .hint {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Video ──────────────────────────────── */
    .video-wrap {
      width: 100%;
      max-width: 860px;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 0 0 1px #2a2a2a;
    }
    .video-wrap iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }
  </style>
</head>
<body>

  <h1>Multipass Card Customizer</h1>

  <div class="tool-row">

    <!-- Canvas -->
    <div id="canvas-wrap">
      <canvas id="card-canvas" width="540" height="340"></canvas>
      <div id="placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
        <span>Upload a template to begin</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <a href="https://dailyprintdelights.etsy.com" target="_blank" class="btn">Buy Templates</a>

      <label class="btn secondary">
        Upload Template
        <input type="file" id="templateUpload" accept="image/*" style="display:none">
      </label>

      <div id="extra-controls">
        <div class="divider"></div>

        <label class="btn secondary">
          Upload Photo
          <input type="file" id="photoUpload" accept="image/*" style="display:none">
        </label>

        <input type="text" id="nameInput" placeholder="Enter full name" maxlength="40" autocomplete="off">

        <div class="slider-row">
          <label>Photo size</label>
          <input type="range" id="sizeSlider" min="0.05" max="5" step="0.01" value="1.0">
        </div>

        <button id="downloadBtn" class="btn">Download Card</button>

        <p class="hint">Drag photo to reposition · Scroll to zoom<br>This is a cosplay tool — no data is saved.</p>
      </div>
    </div>

  </div>

  <!-- Tutorial -->
  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/USozvRE2INs" allowfullscreen></iframe>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────
    //  Config — matches Python exactly
    // ─────────────────────────────────────────────────────────────
    const LEFT_RECT   = { x: 30,  y: 70,  w: 230, h: 190 };
    const RIGHT_RECT  = { x: 280, y: 70,  w: 230, h: 190 };
    const NAME_RECT   = { x: 30,  y: 275, w: 480, h: 50  };

    // Python: paste_x = name_rect[0] - 8 + NAME_X_NUDGE  → 30 - 8 + 2  = 24
    //         paste_y = name_rect[1] - 10 + NAME_Y_NUDGE → 275 - 10 + 15 = 280
    const NAME_PASTE_X = 24;
    const NAME_PASTE_Y = 280;
    const NAME_FONT_SIZE = 65;

    // ─────────────────────────────────────────────────────────────
    //  State
    // ─────────────────────────────────────────────────────────────
    let templateImg = null;
    let photoImg    = null;
    let photoX      = 0;      // top-left of photo in canvas coords (like Python)
    let photoY      = 0;
    let photoScale  = 1.0;

    let isDragging  = false;
    let dragStartX  = 0, dragStartY  = 0;
    let dragPhotoX0 = 0, dragPhotoY0 = 0;

    // ─────────────────────────────────────────────────────────────
    //  Canvas setup
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('card-canvas');
    const ctx    = canvas.getContext('2d', { willReadFrequently: true });

    // ─────────────────────────────────────────────────────────────
    //  Helpers
    // ─────────────────────────────────────────────────────────────
    function makeTempCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }

    /**
     * Returns a canvas (RIGHT_RECT.w × RIGHT_RECT.h) containing the
     * photo clipped to the right rect — identical to Python's normal_patch.
     */
    function buildRightCanvas() {
      const { x: rx, y: ry, w: rw, h: rh } = RIGHT_RECT;
      const c   = makeTempCanvas(rw, rh);
      const cx  = c.getContext('2d');
      const pw  = photoImg.naturalWidth  * photoScale;
      const ph  = photoImg.naturalHeight * photoScale;
      // offset of photo relative to rect's top-left
      cx.drawImage(photoImg, photoX - rx, photoY - ry, pw, ph);
      return c;
    }

    /**
     * Replicates Python's build_negative():
     *   1. Resize src to LEFT_RECT dimensions (same size here, 230×190)
     *   2. Invert (ImageOps.invert)
     *   3. Gaussian blur radius 1.5
     *   4. Mirror horizontally (ImageOps.mirror)
     *   5. Blue-white LUT: R = G = luminance, B = 255
     */
    function buildNegative(rightCanvas) {
      const { w, h } = LEFT_RECT;

      // 1. Copy / resize (src is already 230×190 — same dims)
      const s1  = makeTempCanvas(w, h);
      s1.getContext('2d').drawImage(rightCanvas, 0, 0, w, h);

      // 2. Invert
      const s2  = makeTempCanvas(w, h);
      const c2  = s2.getContext('2d', { willReadFrequently: true });
      c2.drawImage(s1, 0, 0);
      const id2 = c2.getImageData(0, 0, w, h);
      const d2  = id2.data;
      for (let i = 0; i < d2.length; i += 4) {
        d2[i]   = 255 - d2[i];
        d2[i+1] = 255 - d2[i+1];
        d2[i+2] = 255 - d2[i+2];
        // alpha unchanged
      }
      c2.putImageData(id2, 0, 0);

      // 3. Gaussian blur 1.5 px (via CSS filter on a fresh canvas)
      const s3 = makeTempCanvas(w, h);
      const c3 = s3.getContext('2d');
      c3.filter = 'blur(1.5px)';
      c3.drawImage(s2, 0, 0);
      c3.filter = 'none';

      // 4. Mirror horizontally
      const s4 = makeTempCanvas(w, h);
      const c4 = s4.getContext('2d', { willReadFrequently: true });
      c4.translate(w, 0);
      c4.scale(-1, 1);
      c4.drawImage(s3, 0, 0);
      c4.setTransform(1, 0, 0, 1, 0, 0);

      // 5. Blue-white LUT: R = G = luminance, B = 255
      const id4 = c4.getImageData(0, 0, w, h);
      const d4  = id4.data;
      for (let i = 0; i < d4.length; i += 4) {
        const lum = Math.round((d4[i] + d4[i+1] + d4[i+2]) / 3);
        d4[i]   = lum;   // R
        d4[i+1] = lum;   // G
        d4[i+2] = 255;   // B always full
        // alpha unchanged
      }
      c4.putImageData(id4, 0, 0);

      return s4;
    }

    /**
     * Render the name exactly as Python does:
     *  - Font: Arial Narrow Bold, 65 px
     *  - Colour: rgb(255, 30, 30)
     *  - Top-left at (NAME_PASTE_X, NAME_PASTE_Y)
     *  - Squish horizontally if wider than NAME_RECT.w
     */
    function renderName() {
      const name = document.getElementById('nameInput').value.toUpperCase().trim();
      if (!name) return;

      ctx.save();
      ctx.textBaseline = 'top';
      ctx.fillStyle    = 'rgb(255, 30, 30)';
      // Arial Narrow is close enough on all platforms; fallback gracefully
      ctx.font = `bold ${NAME_FONT_SIZE}px "Arial Narrow", "Arial Narrow Bold", Arial, sans-serif`;

      const maxW  = NAME_RECT.w;
      const textW = ctx.measureText(name).width;

      if (textW > maxW) {
        // Squish: scale X only, like Python's text_img.resize((max_w, t_h))
        ctx.translate(NAME_PASTE_X, NAME_PASTE_Y);
        ctx.scale(maxW / textW, 1);
        ctx.fillText(name, 0, 0);
      } else {
        ctx.fillText(name, NAME_PASTE_X, NAME_PASTE_Y);
      }

      ctx.restore();
    }

    // ─────────────────────────────────────────────────────────────
    //  Main render — matches Python's get_display_image() order
    //    1. Black base
    //    2. Negative  (left rect, under template)
    //    3. Normal photo (right rect, under template)
    //    4. Template on top
    //    5. Name on top of everything
    // ─────────────────────────────────────────────────────────────
    function render() {
      // 1. Black base
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 540, 340);

      if (photoImg) {
        const rightCanvas = buildRightCanvas();

        // 2. Negative → left rect
        const negCanvas = buildNegative(rightCanvas);
        ctx.drawImage(negCanvas, LEFT_RECT.x, LEFT_RECT.y);

        // 3. Normal photo → right rect
        ctx.drawImage(rightCanvas, RIGHT_RECT.x, RIGHT_RECT.y);
      }

      // 4. Template on top (alpha-composited, like Python's alpha_composite)
      if (templateImg) {
        ctx.drawImage(templateImg, 0, 0, 540, 340);
      }

      // 5. Name above everything
      if (templateImg || photoImg) {
        renderName();
      }
    }

    // Render loop
    function loop() { render(); requestAnimationFrame(loop); }
    loop();

    // ─────────────────────────────────────────────────────────────
    //  Template upload
    // ─────────────────────────────────────────────────────────────
    document.getElementById('templateUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        templateImg = img;
        URL.revokeObjectURL(url);
        document.getElementById('placeholder').classList.add('hidden');
        document.getElementById('extra-controls').style.display = 'flex';
      };
      img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load template image.'); };
      img.src = url;
    });

    // ─────────────────────────────────────────────────────────────
    //  Photo upload — centres in right rect at scale 1.0 (like Python)
    // ─────────────────────────────────────────────────────────────
    document.getElementById('photoUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        photoImg   = img;
        photoScale = 1.0;
        document.getElementById('sizeSlider').value = 1.0;

        // Center in right rect (Python: right_rect[0] + (rw - photo_img.width) // 2)
        const rw = RIGHT_RECT.w, rh = RIGHT_RECT.h;
        photoX = RIGHT_RECT.x + (rw - img.naturalWidth)  / 2;
        photoY = RIGHT_RECT.y + (rh - img.naturalHeight) / 2;

        URL.revokeObjectURL(url);
      };
      img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load photo.'); };
      img.src = url;
    });

    // ─────────────────────────────────────────────────────────────
    //  Name input
    // ─────────────────────────────────────────────────────────────
    document.getElementById('nameInput').addEventListener('input', () => { /* loop handles it */ });

    // ─────────────────────────────────────────────────────────────
    //  Size slider — synced with scroll/zoom
    // ─────────────────────────────────────────────────────────────
    document.getElementById('sizeSlider').addEventListener('input', e => {
      photoScale = parseFloat(e.target.value);
    });

    function syncSlider() {
      const slider = document.getElementById('sizeSlider');
      slider.value = Math.min(parseFloat(slider.max), Math.max(parseFloat(slider.min), photoScale));
    }

    // ─────────────────────────────────────────────────────────────
    //  Download
    // ─────────────────────────────────────────────────────────────
    document.getElementById('downloadBtn').addEventListener('click', () => {
      render(); // ensure freshest frame
      const name = document.getElementById('nameInput').value.trim().toUpperCase().replace(/ /g, '_') || 'MULTIPASS';
      const link = document.createElement('a');
      link.download = name + '_multipass_card.png';
      link.href     = canvas.toDataURL('image/png');
      link.click();
    });

    // ─────────────────────────────────────────────────────────────
    //  Mouse drag — photo repositioning
    // ─────────────────────────────────────────────────────────────
    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width  / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top)  * scaleY
      };
    }

    canvas.addEventListener('mousedown', e => {
      if (!photoImg) return;
      isDragging  = true;
      const pos   = canvasCoords(e);
      dragStartX  = pos.x;
      dragStartY  = pos.y;
      dragPhotoX0 = photoX;
      dragPhotoY0 = photoY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const pos = canvasCoords(e);
      photoX = dragPhotoX0 + (pos.x - dragStartX);
      photoY = dragPhotoY0 + (pos.y - dragStartY);
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // ─────────────────────────────────────────────────────────────
    //  Scroll to zoom (like Python's mousewheel)
    // ─────────────────────────────────────────────────────────────
    canvas.addEventListener('wheel', e => {
      if (!photoImg) return;
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      photoScale   = Math.max(0.05, Math.min(20, photoScale * factor));
      syncSlider();
    }, { passive: false });

    // ─────────────────────────────────────────────────────────────
    //  Arrow keys for fine positioning (like Python)
    // ─────────────────────────────────────────────────────────────
    window.addEventListener('keydown', e => {
      if (!photoImg) return;
      const step = 5;
      if (e.key === 'ArrowLeft')  { photoX -= step; e.preventDefault(); }
      if (e.key === 'ArrowRight') { photoX += step; e.preventDefault(); }
      if (e.key === 'ArrowUp')    { photoY -= step; e.preventDefault(); }
      if (e.key === 'ArrowDown')  { photoY += step; e.preventDefault(); }
    });

    // ─────────────────────────────────────────────────────────────
    //  Touch support (basic pinch-to-zoom + drag)
    // ─────────────────────────────────────────────────────────────
    let lastTouchDist = null;

    canvas.addEventListener('touchstart', e => {
      if (!photoImg) return;
      if (e.touches.length === 1) {
        isDragging  = true;
        dragStartX  = e.touches[0].clientX;
        dragStartY  = e.touches[0].clientY;
        dragPhotoX0 = photoX;
        dragPhotoY0 = photoY;
      }
      if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (!photoImg) return;
      if (e.touches.length === 1 && isDragging) {
        const rect  = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        photoX = dragPhotoX0 + (e.touches[0].clientX - dragStartX) * scaleX;
        photoY = dragPhotoY0 + (e.touches[0].clientY - dragStartY) * scaleY;
      }
      if (e.touches.length === 2 && lastTouchDist !== null) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        photoScale = Math.max(0.05, Math.min(20, photoScale * (dist / lastTouchDist)));
        lastTouchDist = dist;
        syncSlider();
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      isDragging    = false;
      lastTouchDist = null;
    });
  </script>
</body>
</html>
