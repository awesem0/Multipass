<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multipass Card Customizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
      font-weight: 400;
    }

    .tool-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    /* ── Canvas wrapper ──────────────────────────────── */
    /*
      Canvas internal: 1010 × 638 px (real template resolution)
      CSS display:      ~541 × 341 px  (ratio 1010/638 = 1.584)
    */
    #canvas-wrap {
      position: relative;
      width:  541px;
      height: 341px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2a2a2a, 0 24px 60px rgba(0,0,0,0.85);
      flex-shrink: 0;
      background: #000;
    }

    #card-canvas {
      display: block;
      width:  541px;
      height: 341px;
      cursor: grab;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    #card-canvas:active { cursor: grabbing; }

    /* Placeholder sits behind canvas (z 0). Never drawn on canvas → no CORS taint. */
    #placeholder-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    /* ── Controls ─────────────────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 270px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 18px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #262626; }
    .btn.secondary:hover { background: #333; }
    label.btn { display: block; }

    .divider { height: 1px; background: #2a2a2a; margin: 4px 0; }

    #extra-controls { display: none; flex-direction: column; gap: 10px; }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 16px;
      font-weight: 600;
      background: #1c1c1c;
      color: #f0f0f0;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="text"]::placeholder { color: #444; font-weight: 400; }

    .slider-row { display: flex; flex-direction: column; gap: 4px; }
    .slider-row label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
    }
    input[type="range"] { width: 100%; accent-color: #3b82f6; cursor: pointer; }

    .hint { font-size: 11px; color: #444; text-align: center; line-height: 1.6; }

    /* ── Video ────────────────────────────────────────── */
    .video-wrap {
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 0 0 1px #2a2a2a;
    }
    .video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <h1>Multipass Card Customizer</h1>

  <div class="tool-row">

    <div id="canvas-wrap">
      <!-- Example card shown before template is uploaded.
           Plain <img> — never painted on canvas — so canvas.toDataURL() stays clean. -->
      <img id="placeholder-img"
           src="https://raw.githubusercontent.com/awesem0/Multipass/0e00515cd0cd581340f11c57f96212985759b4cc/LEELOO%20DALLAS_multipass_card.png"
           alt="Example Multipass card"
           crossorigin="anonymous">

      <!-- 1010×638 internal, displayed at 541×341 via CSS -->
      <canvas id="card-canvas" width="1010" height="638"></canvas>
    </div>

    <div class="controls">
      <a href="https://dailyprintdelights.etsy.com" target="_blank" class="btn">Buy Templates</a>

      <label class="btn secondary">
        Upload Template
        <input type="file" id="templateUpload" accept="image/*" style="display:none">
      </label>

      <div id="extra-controls">
        <div class="divider"></div>

        <label class="btn secondary">
          Upload Photo
          <input type="file" id="photoUpload" accept="image/*" style="display:none">
        </label>

        <input type="text" id="nameInput" placeholder="Enter full name" maxlength="40" autocomplete="off">

        <div class="slider-row">
          <label>Photo size</label>
          <input type="range" id="sizeSlider" min="0.05" max="5" step="0.01" value="1.0">
        </div>

        <button id="downloadBtn" class="btn">Download Card</button>

        <p class="hint">
          Drag to reposition · Scroll / pinch to zoom<br>
          Arrow keys for fine nudge · No data is saved.
        </p>
      </div>
    </div>

  </div>

  <div class="video-wrap">
    <iframe src="https://youtu.be/5GGTjFU8BCg" allowfullscreen></iframe>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    //  GEOMETRY — exact values from multipass_corners.txt
    //  All coordinates are in the real 1010 × 638 canvas space.
    //
    //  Derived via get_rect(corners):
    //    xs = [p[0] for p in pts], ys = [p[1] for p in pts]
    //    rect = { x: min(xs), y: min(ys), w: max(xs)-min(xs), h: max(ys)-min(ys) }
    //
    //  Name paste position:
    //    paste_x = name_rect.x - 8 + NAME_X_NUDGE  →  549.9 - 8 + 2  = 543.9
    //    paste_y = name_rect.y - 10 + NAME_Y_NUDGE →  118.1 - 10 + 15 = 123.1
    // ═══════════════════════════════════════════════════════════════════

    const CW = 1010, CH = 638;

    // Left rect  — negative / blue-LUT photo
    const LEFT_RECT  = { x: 20.6,  y: 120.0, w: 243.1, h: 349.9 };
    // Right rect — normal colour photo
    const RIGHT_RECT = { x: 288.0, y: 120.0, w: 243.1, h: 348.0 };
    // Name rect  — TOP-RIGHT of card
    const NAME_RECT  = { x: 549.9, y: 118.1, w: 439.5, h: 52.4  };

    // Python name paste coords (already in 1010×638 space)
    const NAME_PASTE_X = 543.9;
    const NAME_PASTE_Y = 123.1;
    const NAME_FONT_SZ = 65;     // same as Python — the rect height is 52 px so
                                  // the font intentionally overflows slightly

    // ═══════════════════════════════════════════════════════════════════
    //  State
    // ═══════════════════════════════════════════════════════════════════
    let templateImg = null, photoImg = null;
    let photoX = 0, photoY = 0, photoScale = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0, dragPhotoX0 = 0, dragPhotoY0 = 0;
    let lastTouchDist = null;

    // ═══════════════════════════════════════════════════════════════════
    //  Canvas
    // ═══════════════════════════════════════════════════════════════════
    const canvas = document.getElementById('card-canvas');
    const ctx    = canvas.getContext('2d', { willReadFrequently: true });

    // ═══════════════════════════════════════════════════════════════════
    //  Helpers
    // ═══════════════════════════════════════════════════════════════════
    function makeTmp(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }

    /**
     * Returns a (RIGHT_RECT.w × RIGHT_RECT.h) canvas with the photo clipped to
     * RIGHT_RECT — equivalent to Python's normal_patch.
     */
    function buildRightCanvas() {
      const { x: rx, y: ry, w: rw, h: rh } = RIGHT_RECT;
      const c  = makeTmp(rw, rh);
      c.getContext('2d').drawImage(
        photoImg,
        photoX - rx, photoY - ry,
        photoImg.naturalWidth  * photoScale,
        photoImg.naturalHeight * photoScale
      );
      return c;
    }

    /**
     * Python's build_negative():
     *   1. Copy/resize src to LEFT_RECT dimensions (same size — 1:1 copy)
     *   2. Invert pixels  (ImageOps.invert)
     *   3. Gaussian blur 1.5 px  (GaussianBlur)
     *   4. Mirror horizontally  (ImageOps.mirror)
     *   5. Blue-white LUT: R = G = luminance, B = 255
     */
    function buildNegative(rightCanvas) {
      const { w, h } = LEFT_RECT;

      // 1. Copy (both rects same size, 243×349)
      const s1 = makeTmp(w, h);
      s1.getContext('2d').drawImage(rightCanvas, 0, 0, w, h);

      // 2. Invert
      const s2 = makeTmp(w, h);
      const c2 = s2.getContext('2d', { willReadFrequently: true });
      c2.drawImage(s1, 0, 0);
      const id2 = c2.getImageData(0, 0, w, h);
      for (let i = 0; i < id2.data.length; i += 4) {
        id2.data[i]   = 255 - id2.data[i];
        id2.data[i+1] = 255 - id2.data[i+1];
        id2.data[i+2] = 255 - id2.data[i+2];
      }
      c2.putImageData(id2, 0, 0);

      // 3. Blur 1.5 px
      const s3 = makeTmp(w, h);
      const c3 = s3.getContext('2d');
      c3.filter = 'blur(1.5px)';
      c3.drawImage(s2, 0, 0);

      // 4. Mirror horizontally
      const s4 = makeTmp(w, h);
      const c4 = s4.getContext('2d', { willReadFrequently: true });
      c4.translate(w, 0);
      c4.scale(-1, 1);
      c4.drawImage(s3, 0, 0);
      c4.setTransform(1, 0, 0, 1, 0, 0);

      // 5. Blue-white LUT: R = G = luminance, B always 255
      const id4 = c4.getImageData(0, 0, w, h);
      for (let i = 0; i < id4.data.length; i += 4) {
        const lum = Math.round((id4.data[i] + id4.data[i+1] + id4.data[i+2]) / 3);
        id4.data[i]   = lum;
        id4.data[i+1] = lum;
        id4.data[i+2] = 255;
      }
      c4.putImageData(id4, 0, 0);

      return s4;
    }

    /**
     * Name text — matches Python's render_name_on():
     *   Font:    Arial Narrow Bold, NAME_FONT_SZ px
     *   Colour:  rgb(255, 30, 30)
     *   Anchor:  top-left at (NAME_PASTE_X, NAME_PASTE_Y)  ← TOP-RIGHT of card
     *   Squish:  if text wider than NAME_RECT.w, scale X only (like PIL resize)
     */
    function renderName() {
      const name = document.getElementById('nameInput').value.toUpperCase().trim();
      if (!name) return;

      ctx.save();
      ctx.textBaseline = 'top';
      ctx.fillStyle    = 'rgb(255, 30, 30)';
      ctx.font         = `bold ${NAME_FONT_SZ}px "Arial Narrow", Arial, sans-serif`;

      const textW = ctx.measureText(name).width;
      const maxW  = NAME_RECT.w;

      if (textW > maxW) {
        ctx.translate(NAME_PASTE_X, NAME_PASTE_Y);
        ctx.scale(maxW / textW, 1);
        ctx.fillText(name, 0, 0);
      } else {
        ctx.fillText(name, NAME_PASTE_X, NAME_PASTE_Y);
      }
      ctx.restore();
    }

    // ═══════════════════════════════════════════════════════════════════
    //  Render — Python composite order:
    //    1. Black base
    //    2. Negative photo → LEFT_RECT   (under template)
    //    3. Normal photo   → RIGHT_RECT  (under template)
    //    4. Template       → full canvas (alpha_composite on top)
    //    5. Name           → above everything
    // ═══════════════════════════════════════════════════════════════════
    function render() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CW, CH);

      if (photoImg) {
        const right = buildRightCanvas();
        ctx.drawImage(buildNegative(right), LEFT_RECT.x,  LEFT_RECT.y);
        ctx.drawImage(right,                RIGHT_RECT.x, RIGHT_RECT.y);
      }

      if (templateImg) {
        ctx.drawImage(templateImg, 0, 0, CW, CH);
        renderName();   // name always on top
      }
    }

    function loop() { render(); requestAnimationFrame(loop); }
    loop();

    // ═══════════════════════════════════════════════════════════════════
    //  File loading helper
    // ═══════════════════════════════════════════════════════════════════
    function loadImageFile(file, cb) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload  = () => { cb(img); URL.revokeObjectURL(url); };
      img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load image.'); };
      img.src = url;
    }

    // ── Template upload ──────────────────────────────────────────────
    document.getElementById('templateUpload').addEventListener('change', e => {
      if (!e.target.files[0]) return;
      loadImageFile(e.target.files[0], img => {
        templateImg = img;
        document.getElementById('placeholder-img').style.display = 'none';
        document.getElementById('extra-controls').style.display  = 'flex';
      });
    });

    // ── Photo upload — centred in RIGHT_RECT at scale 1.0 (like Python) ─
    document.getElementById('photoUpload').addEventListener('change', e => {
      if (!e.target.files[0]) return;
      loadImageFile(e.target.files[0], img => {
        photoImg   = img;
        photoScale = 1.0;
        document.getElementById('sizeSlider').value = 1.0;
        // Python: photo_offset_x = right_rect[0] + (rw - img.width) // 2
        photoX = RIGHT_RECT.x + (RIGHT_RECT.w - img.naturalWidth)  / 2;
        photoY = RIGHT_RECT.y + (RIGHT_RECT.h - img.naturalHeight) / 2;
      });
    });

    // ── Slider ───────────────────────────────────────────────────────
    document.getElementById('sizeSlider').addEventListener('input', e => {
      photoScale = parseFloat(e.target.value);
    });

    function syncSlider() {
      const s = document.getElementById('sizeSlider');
      s.value = Math.min(+s.max, Math.max(+s.min, photoScale));
    }

    // ── Download — full 1010×638 PNG ─────────────────────────────────
    document.getElementById('downloadBtn').addEventListener('click', () => {
      render();
      const name = (document.getElementById('nameInput').value.trim().toUpperCase().replace(/ /g, '_')) || 'MULTIPASS';
      const a = document.createElement('a');
      a.download = name + '_multipass_card.png';
      a.href     = canvas.toDataURL('image/png');
      a.click();
    });

    // ═══════════════════════════════════════════════════════════════════
    //  Input coord conversion: CSS pixels → 1010×638 canvas pixels
    // ═══════════════════════════════════════════════════════════════════
    function toCanvas(cx, cy) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (cx - r.left) * (CW / r.width),
        y: (cy - r.top)  * (CH / r.height)
      };
    }

    // ── Mouse drag ───────────────────────────────────────────────────
    canvas.addEventListener('mousedown', e => {
      if (!photoImg) return;
      isDragging = true;
      const p = toCanvas(e.clientX, e.clientY);
      dragStartX = p.x; dragStartY = p.y;
      dragPhotoX0 = photoX; dragPhotoY0 = photoY;
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const p = toCanvas(e.clientX, e.clientY);
      photoX = dragPhotoX0 + (p.x - dragStartX);
      photoY = dragPhotoY0 + (p.y - dragStartY);
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // ── Scroll zoom ──────────────────────────────────────────────────
    canvas.addEventListener('wheel', e => {
      if (!photoImg) return;
      e.preventDefault();
      photoScale = Math.max(0.05, Math.min(20, photoScale * (e.deltaY > 0 ? 0.95 : 1.05)));
      syncSlider();
    }, { passive: false });

    // ── Arrow key nudge (5 canvas-px, same as Python) ─────────────────
    window.addEventListener('keydown', e => {
      if (!photoImg) return;
      const step = 5;
      if (e.key === 'ArrowLeft')  { photoX -= step; e.preventDefault(); }
      if (e.key === 'ArrowRight') { photoX += step; e.preventDefault(); }
      if (e.key === 'ArrowUp')    { photoY -= step; e.preventDefault(); }
      if (e.key === 'ArrowDown')  { photoY += step; e.preventDefault(); }
    });

    // ── Touch: drag + pinch zoom ─────────────────────────────────────
    canvas.addEventListener('touchstart', e => {
      if (!photoImg) return;
      if (e.touches.length === 1) {
        isDragging = true;
        const p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
        dragStartX = p.x; dragStartY = p.y;
        dragPhotoX0 = photoX; dragPhotoY0 = photoY;
      }
      if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (!photoImg) return;
      if (e.touches.length === 1 && isDragging) {
        const p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
        photoX = dragPhotoX0 + (p.x - dragStartX);
        photoY = dragPhotoY0 + (p.y - dragStartY);
      }
      if (e.touches.length === 2 && lastTouchDist) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        photoScale = Math.max(0.05, Math.min(20, photoScale * (d / lastTouchDist)));
        lastTouchDist = d;
        syncSlider();
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });
  </script>
</body>
</html>
