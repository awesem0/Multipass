<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multipass Card Customizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    body { margin:0; padding:0; background:#111; color:#fff; font-family:Arial; padding-top:60px; }
    .main-container { display:flex; flex-direction:column; align-items:center; gap:15px; padding:20px; }
    .tool-row { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; width:100%; max-width:840px; }
    #canvas-container { width:540px; height:340px; background:white; border-radius:20px; overflow:hidden; }
    .controls { display:flex; flex-direction:column; gap:8px; width:280px; }
    .button, label.button { padding:14px 20px; background:#3b82f6; color:white; border:none; font-size:15px; cursor:pointer; width:100%; text-align:center; box-sizing:border-box; }
    .button:hover { background:#2563eb; }
    input[type="text"], input[type="range"] { width:100%; padding:12px; font-size:18px; box-sizing:border-box; }
    .disclaimer { font-size:12px; text-align:center; color:#ddd; }
    #additional-controls { display:none; flex-direction:column; gap:8px; }
    .video-tutorial { margin:15px 0 30px 0; text-align:center; width:100%; max-width:840px; }
    .video-tutorial iframe { width:100%; max-width:840px; height:473px; border:none; border-radius:12px; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="tool-row">
      <div id="canvas-container"></div>
      <div class="controls">
        <a href="https://dailyprintdelights.etsy.com" target="_blank" class="button">BUY TEMPLATES</a>
        <label class="button">UPLOAD TEMPLATE <input type="file" id="templateUpload" accept="image/*" style="display:none;"></label>
        
        <div id="additional-controls">
          <label class="button">UPLOAD PHOTO <input type="file" id="photoUpload" accept="image/*" style="display:none;"></label>
          <input type="text" id="nameInput" placeholder="Enter full name" maxlength="40">
          <label>Photo Size: <input type="range" id="sizeSlider" min="0.3" max="2.5" step="0.01" value="1.4"></label>
          <button id="download" class="button">DOWNLOAD CARD</button>
          <div class="disclaimer">This is a cosplay tool. No data or images are saved.</div>
        </div>
      </div>
    </div>

    <div class="video-tutorial">
      <iframe src="https://www.youtube.com/embed/USozvRE2INs" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    let canvas, templateImg = null, photoImg = null;
    let photoX = 0, photoY = 0, photoScale = 0.8;
    let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;
    let nameLetters = [];
    let letterMap = {};

    // Hardcoded rects for Multipass (540x340) - matches your Python script
    const LEFT_RECT = { x: 30, y: 70, w: 230, h: 190 };
    const RIGHT_RECT = { x: 280, y: 70, w: 230, h: 190 };
    const NAME_RECT = { x: 30, y: 275, w: 480, h: 50 };

    function preload() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ ';
      for (let char of letters) {
        if (char === ' ') continue;
        loadImage(`https://raw.githubusercontent.com/awesem0/Ferrari/main/${char}.png`, img => letterMap[char] = img);
      }
    }

    function setup() {
      let c = createCanvas(540, 340);
      c.parent('canvas-container');
    }

    function applyBlueLUT(img) {
      img.loadPixels();
      for (let i = 0; i < img.pixels.length; i += 4) {
        let gray = (img.pixels[i] + img.pixels[i+1] + img.pixels[i+2]) / 3;
        img.pixels[i] = gray;
        img.pixels[i+1] = gray;
        img.pixels[i+2] = 255;
      }
      img.updatePixels();
      return img;
    }

    function buildNegative(normalImg, w, h) {
      let resized = normalImg.get();
      resized.resize(w, h);
      resized.filter(INVERT);
      resized.filter(BLUR, 1.5);
      
      // Mirror horizontally
      let flipped = createImage(w, h);
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          flipped.set(x, y, resized.get(w - 1 - x, y));
        }
      }
      flipped.updatePixels();
      return applyBlueLUT(flipped);
    }

    function draw() {
      clear();
      
      // 1. Black base
      background(0);
      
      if (photoImg && templateImg) {
        // Right side - normal photo (clipped)
        let rx = RIGHT_RECT.x, ry = RIGHT_RECT.y, rw = RIGHT_RECT.w, rh = RIGHT_RECT.h;
        let pw = photoImg.width * photoScale;
        let ph = photoImg.height * photoScale;
        
        // Clip photo to right rect
        let sx = max(0, rx - (width/2 + photoX - pw/2));
        let sy = max(0, ry - (height/2 + photoY - ph/2));
        let sw = min(pw, rw);
        let sh = min(ph, rh);
        
        if (sw > 0 && sh > 0) {
          // Draw normal photo on right
          image(photoImg, rx, ry, rw, rh, sx, sy, sw, sh);
        }
        
        // Left side - negative blue LUT (mirrored)
        let neg = buildNegative(photoImg, rw, rh);
        image(neg, LEFT_RECT.x, LEFT_RECT.y);
      }
      
      // 2. Template on top
      if (templateImg) {
        image(templateImg, 0, 0, width, height);
      }
      
      // 3. Name (red + nudge + squish)
      if (nameLetters.length > 0) {
        let x = NAME_RECT.x + 2;  // NAME_X_NUDGE
        let y = NAME_RECT.y + 15; // NAME_Y_NUDGE
        let letterH = 28;
        let gap = 1.5;
        
        for (let letter of nameLetters) {
          if (letter === ' ') { x += 18; continue; }
          let img = letterMap[letter];
          if (img) {
            let s = letterH / img.height;
            let tw = img.width * s;
            
            // Squish if too wide
            if (x + tw > NAME_RECT.x + NAME_RECT.w) {
              s = (NAME_RECT.x + NAME_RECT.w - x) / img.width;
              tw = NAME_RECT.x + NAME_RECT.w - x;
            }
            
            image(img, x, y - letterH, tw, letterH);
            x += tw + gap;
          }
        }
      }
    }

    document.getElementById('templateUpload').addEventListener('change', e => {
      let file = e.target.files[0];
      if (file) {
        let url = URL.createObjectURL(file);
        loadImage(url, img => {
          templateImg = img;
          document.getElementById('additional-controls').style.display = 'flex';
          URL.revokeObjectURL(url);
        });
      }
    });

    document.getElementById('photoUpload').addEventListener('change', e => {
      let file = e.target.files[0];
      if (file) {
        let url = URL.createObjectURL(file);
        loadImage(url, img => {
          photoImg = img;
          photoX = RIGHT_RECT.x + RIGHT_RECT.w/2 - (img.width * photoScale)/2;
          photoY = RIGHT_RECT.y + RIGHT_RECT.h/2 - (img.height * photoScale)/2;
          document.getElementById('sizeSlider').value = 1.4;
          URL.revokeObjectURL(url);
        });
      }
    });

    document.getElementById('nameInput').addEventListener('input', () => {
      let name = document.getElementById('nameInput').value.toUpperCase();
      nameLetters = name.split('');
    });

    document.getElementById('sizeSlider').addEventListener('input', e => photoScale = parseFloat(e.target.value));

    document.getElementById('download').addEventListener('click', () => {
      let name = document.getElementById('nameInput').value.trim().toUpperCase().replace(/ /g, '_') || 'multipass';
      saveCanvas(name, 'png');
    });

    function mousePressed() { if (photoImg) { isDragging = true; dragOffsetX = mouseX - photoX; dragOffsetY = mouseY - photoY; }}
    function mouseDragged() { if (isDragging) { photoX = mouseX - dragOffsetX; photoY = mouseY - dragOffsetY; }}
    function mouseReleased() { isDragging = false; }
    function mouseWheel(e) { if (photoImg) photoScale *= e.delta > 0 ? 0.95 : 1.05; }

    function keyPressed() {
      if (!photoImg) return;
      let step = 5;
      if (keyCode === LEFT_ARROW) photoX -= step;
      if (keyCode === RIGHT_ARROW) photoX += step;
      if (keyCode === UP_ARROW) photoY -= step;
      if (keyCode === DOWN_ARROW) photoY += step;
    }
  </script>
</body>
</html>
