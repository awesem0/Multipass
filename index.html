<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multipass Card Customizer • Fifth Element</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #555555;
      font-weight: 500;
    }

    .tool-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }

    #canvas-wrap {
      position: relative;
      width: 540px;
      height: 341px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px #262626, 0 30px 70px rgba(0,0,0,0.85);
      flex-shrink: 0;
      background: #000;
    }

    #card-canvas {
      display: block;
      width: 540px;
      height: 341px;
      cursor: grab;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    #card-canvas:active { cursor: grabbing; }

    #placeholder-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 268px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      background: #3b82f6;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }
    .btn:hover { background: #2563eb; transform: translateY(-1px); }
    .btn.secondary { background: #262626; box-shadow: none; }
    .btn.secondary:hover { background: #333333; }
    label.btn { display: block; }

    .divider { height: 1px; background: #2a2a2a; margin: 6px 0; }

    #extra-controls { display: none; flex-direction: column; gap: 10px; }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      background: #1c1c1c;
      color: #f0f0f0;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="text"]::placeholder { color: #555555; font-weight: 400; }

    .slider-row { display: flex; flex-direction: column; gap: 5px; }
    .slider-row label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555555;
    }
    input[type="range"] { width: 100%; accent-color: #3b82f6; cursor: pointer; height: 6px; }

    .hint {
      font-size: 10px;
      color: #444444;
      text-align: center;
      line-height: 1.45;
    }

    .video-wrap {
      width: 100%;
      max-width: 1100px;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 0 0 1px #262626;
    }
    .video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

    .demo-note { font-size: 9px; color: #666666; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>MULTIPASS CARD CUSTOMIZER • THE FIFTH ELEMENT</h1>

  <div class="tool-row">

    <div id="canvas-wrap">
      <img id="placeholder-img"
           src="https://raw.githubusercontent.com/awesem0/Multipass/0e00515cd0cd581340f11c57f96212985759b4cc/LEELOO%20DALLAS_multipass_card.png"
           alt="Example Multipass card - Leeloo Dallas"
           onerror="this.style.display='none'">

      <canvas id="card-canvas" width="1010" height="638"></canvas>
    </div>

    <div class="controls">
      <a href="https://dailyprintdelights.etsy.com" target="_blank" class="btn">Buy Official Templates</a>
      <button id="demoBtn" class="btn secondary">Load Demo (Leeloo Dallas)</button>

      <label class="btn secondary">
        Upload Template (F or M)
        <input type="file" id="templateUpload" accept="image/*" style="display:none">
      </label>

      <div id="extra-controls">
        <div class="divider"></div>
        <label class="btn secondary">
          Upload Your Photo
          <input type="file" id="photoUpload" accept="image/*" style="display:none">
        </label>
        <input type="text" id="nameInput" placeholder="ENTER FULL NAME" maxlength="40" autocomplete="off">
        <div class="slider-row">
          <label>PHOTO ZOOM / SIZE</label>
          <input type="range" id="sizeSlider" min="0.05" max="5" step="0.01" value="1.0">
        </div>
        <button id="downloadBtn" class="btn">DOWNLOAD CARD + REAR</button>
        <p class="hint">Drag to move • Scroll/pinch to zoom • Arrow keys • Exact Python logic</p>
      </div>
    </div>
  </div>

  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/USozvRE2INs" allowfullscreen></iframe>
  </div>

  <div class="demo-note">Name now perfectly TOP-RIGHT in red (65px) • Negative only on left slot • No more red J's</div>

  <script>
    const CW = 1010, CH = 638;

    // FINAL CORRECTED GEOMETRY (matches your desired output exactly)
    const LEFT_RECT  = { x:  85, y: 145, w: 225, h: 285 };
    const RIGHT_RECT = { x: 355, y: 145, w: 225, h: 285 };

    // NAME EXACTLY TOP-RIGHT like the second image
    const NAME_RECT  = { x: 600, y: 35, w: 380, h: 75 };
    const NAME_PASTE_X = 600 - 8 + 2;   // 594
    const NAME_PASTE_Y = 35 - 10 + 15;  // 40
    const NAME_FONT_SZ = 65;            // Exact Python size

    let templateImg = null, photoImg = null;
    let photoX = 0, photoY = 0, photoScale = 1.0;
    let isDragging = false, dragStartX = 0, dragStartY = 0, dragPhotoX0 = 0, dragPhotoY0 = 0;
    let lastTouchDist = null;

    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function makeTempCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }

    function getPhotoDims(img) {
      return { w: img.naturalWidth || img.width || 0, h: img.naturalHeight || img.height || 0 };
    }

    function buildRightCanvas() {
      const { x: rx, y: ry, w: rw, h: rh } = RIGHT_RECT;
      const c = makeTempCanvas(rw, rh);
      const dims = getPhotoDims(photoImg);
      c.getContext('2d').drawImage(photoImg, photoX - rx, photoY - ry, dims.w * photoScale, dims.h * photoScale);
      return c;
    }

    function buildNegative(rightCanvas) {
      const { w, h } = LEFT_RECT;
      const s1 = makeTempCanvas(w, h);
      s1.getContext('2d').drawImage(rightCanvas, 0, 0, w, h);

      const s2 = makeTempCanvas(w, h);
      const c2 = s2.getContext('2d', { willReadFrequently: true });
      c2.drawImage(s1, 0, 0);
      const id2 = c2.getImageData(0, 0, w, h);
      for (let i = 0; i < id2.data.length; i += 4) {
        id2.data[i] = 255 - id2.data[i];
        id2.data[i+1] = 255 - id2.data[i+1];
        id2.data[i+2] = 255 - id2.data[i+2];
      }
      c2.putImageData(id2, 0, 0);

      const s3 = makeTempCanvas(w, h);
      const c3 = s3.getContext('2d');
      c3.filter = 'blur(1.5px)';
      c3.drawImage(s2, 0, 0);
      c3.filter = 'none';

      const s4 = makeTempCanvas(w, h);
      const c4 = s4.getContext('2d', { willReadFrequently: true });
      c4.translate(w, 0); c4.scale(-1, 1);
      c4.drawImage(s3, 0, 0);
      c4.setTransform(1, 0, 0, 1, 0, 0);

      const id4 = c4.getImageData(0, 0, w, h);
      for (let i = 0; i < id4.data.length; i += 4) {
        const lum = Math.round((id4.data[i] + id4.data[i+1] + id4.data[i+2]) / 3);
        id4.data[i] = lum; id4.data[i+1] = lum; id4.data[i+2] = 255;
      }
      c4.putImageData(id4, 0, 0);
      return s4;
    }

    function renderName() {
      const name = document.getElementById('nameInput').value.toUpperCase().trim();
      if (!name) return;

      ctx.save();
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgb(255, 30, 30)';
      // Reliable bold condensed font stack (Arial Narrow fallback)
      ctx.font = `bold ${NAME_FONT_SZ}px "Arial Narrow", "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif`;

      const textW = ctx.measureText(name).width;
      const maxW = NAME_RECT.w;

      if (textW > maxW) {
        ctx.translate(NAME_PASTE_X, NAME_PASTE_Y);
        ctx.scale(maxW / textW, 1);
        ctx.fillText(name, 0, 0);
      } else {
        ctx.fillText(name, NAME_PASTE_X, NAME_PASTE_Y);
      }
      ctx.restore();
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, CW, CH);

      if (photoImg) {
        const right = buildRightCanvas();
        ctx.drawImage(buildNegative(right), LEFT_RECT.x, LEFT_RECT.y);
        ctx.drawImage(right, RIGHT_RECT.x, RIGHT_RECT.y);
      }

      if (templateImg) {
        ctx.drawImage(templateImg, 0, 0, CW, CH);
      }

      if (templateImg || photoImg) {
        renderName();
      }
    }

    function loop() { render(); requestAnimationFrame(loop); }
    loop();

    function createDemoPhoto() {
      const c = makeTempCanvas(225, 285);
      const cx = c.getContext('2d');
      cx.fillStyle = '#1e2937'; cx.fillRect(0, 0, 225, 285);
      cx.fillStyle = '#fed7aa';
      cx.beginPath(); cx.ellipse(112, 130, 72, 95, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#b91c1c';
      cx.beginPath(); cx.ellipse(112, 85, 85, 62, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#fff';
      cx.beginPath(); cx.ellipse(82, 118, 16, 10, 0, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.ellipse(142, 118, 16, 10, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#1e40af';
      cx.beginPath(); cx.ellipse(82, 118, 8, 8, 0, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.ellipse(142, 118, 8, 8, 0, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = '#9f1239'; cx.lineWidth = 3.5;
      cx.beginPath(); cx.arc(112, 165, 20, 0.2 * Math.PI, 0.8 * Math.PI); cx.stroke();
      return c;
    }

    function loadDemo() {
      const demo = makeTempCanvas(CW, CH);
      const dctx = demo.getContext('2d');

      const grad = dctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#0a0a0f'); grad.addColorStop(1, '#1a1a2e');
      dctx.fillStyle = grad; dctx.fillRect(0, 0, CW, CH);

      dctx.strokeStyle = '#334155'; dctx.lineWidth = 1;
      for (let x = 20; x < CW; x += 28) { dctx.beginPath(); dctx.moveTo(x, 0); dctx.lineTo(x, CH); dctx.stroke(); }
      for (let y = 20; y < CH; y += 28) { dctx.beginPath(); dctx.moveTo(0, y); dctx.lineTo(CW, y); dctx.stroke(); }

      dctx.strokeStyle = '#22d3ee'; dctx.lineWidth = 6;
      dctx.strokeRect(LEFT_RECT.x - 5, LEFT_RECT.y - 5, LEFT_RECT.w + 10, LEFT_RECT.h + 10);
      dctx.strokeRect(RIGHT_RECT.x - 5, RIGHT_RECT.y - 5, RIGHT_RECT.w + 10, RIGHT_RECT.h + 10);
      dctx.strokeStyle = '#67e8f9'; dctx.lineWidth = 2;
      dctx.strokeRect(LEFT_RECT.x, LEFT_RECT.y, LEFT_RECT.w, LEFT_RECT.h);
      dctx.strokeRect(RIGHT_RECT.x, RIGHT_RECT.y, RIGHT_RECT.w, RIGHT_RECT.h);

      dctx.fillStyle = '#e0f2fe'; dctx.font = 'bold 28px system-ui';
      dctx.fillText('MULTIPASS', 32, 52);
      dctx.font = '11px monospace'; dctx.fillStyle = '#64748b';
      dctx.fillText('FEDERAL REPUBLIC OF EARTH  •  5E-CLASS', 32, 70);

      dctx.fillStyle = '#22d3ee'; dctx.font = 'bold 13px system-ui';
      dctx.fillText('SUBJECT', 920, 52);
      dctx.fillStyle = '#f1f5f9'; dctx.font = '10px monospace';
      dctx.fillText('ID: 784392-5E', 920, 68);

      dctx.fillStyle = '#1e2937'; dctx.fillRect(0, 580, CW, 58);
      dctx.fillStyle = '#64748b'; dctx.font = '9px monospace';
      dctx.fillText('PROPERTY OF THE FEDERATION  •  DO NOT DUPLICATE  •  EXPIRES 12.31.2263', 28, 612);

      dctx.fillStyle = '#475569';
      for (let i = 0; i < 32; i++) {
        const bw = (i % 4 === 0) ? 3 : 1.5;
        dctx.fillRect(820 + i * 5.5, 585, bw, 35);
      }

      templateImg = demo;
      document.getElementById('placeholder-img').style.display = 'none';
      document.getElementById('extra-controls').style.display = 'flex';

      document.getElementById('nameInput').value = 'LEELOO DALLAS';

      photoImg = createDemoPhoto();
      photoScale = 0.95;
      document.getElementById('sizeSlider').value = photoScale;
      const dims = getPhotoDims(photoImg);
      const rw = RIGHT_RECT.w, rh = RIGHT_RECT.h;
      const pw = dims.w * photoScale, ph = dims.h * photoScale;
      photoX = RIGHT_RECT.x + (rw - pw) / 2;
      photoY = RIGHT_RECT.y + (rh - ph) / 2;
    }

    document.getElementById('demoBtn').addEventListener('click', loadDemo);

    function loadImage(file, cb) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { cb(img); URL.revokeObjectURL(url); };
      img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load image.'); };
      img.src = url;
    }

    document.getElementById('templateUpload').addEventListener('change', e => {
      if (!e.target.files[0]) return;
      loadImage(e.target.files[0], img => {
        templateImg = img;
        document.getElementById('placeholder-img').style.display = 'none';
        document.getElementById('extra-controls').style.display = 'flex';
      });
    });

    document.getElementById('photoUpload').addEventListener('change', e => {
      if (!e.target.files[0]) return;
      loadImage(e.target.files[0], img => {
        photoImg = img;
        photoScale = 1.0;
        document.getElementById('sizeSlider').value = 1.0;
        const dims = getPhotoDims(photoImg);
        const rw = RIGHT_RECT.w, rh = RIGHT_RECT.h;
        photoX = RIGHT_RECT.x + (rw - dims.w) / 2;
        photoY = RIGHT_RECT.y + (rh - dims.h) / 2;
      });
    });

    document.getElementById('sizeSlider').addEventListener('input', e => {
      photoScale = parseFloat(e.target.value);
    });

    function syncSlider() {
      const s = document.getElementById('sizeSlider');
      s.value = Math.min(+s.max, Math.max(+s.min, photoScale));
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      render();
      const raw = document.getElementById('nameInput').value.trim().toUpperCase() || 'MULTIPASS';
      const safe = raw.replace(/[^A-Z0-9]/g, '_');

      const a = document.createElement('a');
      a.download = safe + '_multipass_card.png';
      a.href = canvas.toDataURL('image/png');
      a.click();

      setTimeout(() => {
        const rear = makeTempCanvas(CW, CH);
        const rctx = rear.getContext('2d');
        rctx.fillStyle = '#0a0a0f'; rctx.fillRect(0, 0, CW, CH);
        rctx.strokeStyle = '#22d3ee'; rctx.lineWidth = 2;
        for (let i = 0; i < CW; i += 20) { rctx.beginPath(); rctx.moveTo(i, 0); rctx.lineTo(i, CH); rctx.stroke(); }
        rctx.fillStyle = '#e0f2fe'; rctx.font = 'bold 36px system-ui';
        rctx.fillText('MULTIPASS', 280, 180);
        rctx.font = '16px monospace'; rctx.fillStyle = '#64748b';
        rctx.fillText('REAR • DO NOT DUPLICATE', 310, 220);
        rctx.fillStyle = '#475569';
        for (let i = 0; i < 40; i++) {
          const bw = (i % 3 === 0) ? 3.5 : 1.8;
          rctx.fillRect(260 + i * 12, 280, bw, 55);
        }
        rctx.fillStyle = '#94a3b8'; rctx.font = '10px monospace';
        rctx.fillText('FEDERAL REPUBLIC OF EARTH • 5E-CLASS • 2263', 220, 400);

        const rearLink = document.createElement('a');
        rearLink.download = safe + '_multipass_rear.png';
        rearLink.href = rear.toDataURL('image/png');
        rearLink.click();
      }, 450);
    });

    function toCanvas(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return { x: (clientX - r.left) * (CW / r.width), y: (clientY - r.top) * (CH / r.height) };
    }

    canvas.addEventListener('mousedown', e => {
      if (!photoImg) return;
      isDragging = true;
      const p = toCanvas(e.clientX, e.clientY);
      dragStartX = p.x; dragStartY = p.y;
      dragPhotoX0 = photoX; dragPhotoY0 = photoY;
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const p = toCanvas(e.clientX, e.clientY);
      photoX = dragPhotoX0 + (p.x - dragStartX);
      photoY = dragPhotoY0 + (p.y - dragStartY);
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', e => {
      if (!photoImg) return;
      e.preventDefault();
      photoScale = Math.max(0.05, Math.min(20, photoScale * (e.deltaY > 0 ? 0.95 : 1.06)));
      syncSlider();
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (!photoImg) return;
      const step = 6;
      if (e.key === 'ArrowLeft') { photoX -= step; e.preventDefault(); }
      else if (e.key === 'ArrowRight') { photoX += step; e.preventDefault(); }
      else if (e.key === 'ArrowUp') { photoY -= step; e.preventDefault(); }
      else if (e.key === 'ArrowDown') { photoY += step; e.preventDefault(); }
    });

    canvas.addEventListener('touchstart', e => {
      if (!photoImg) return;
      if (e.touches.length === 1) {
        isDragging = true;
        const p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
        dragStartX = p.x; dragStartY = p.y;
        dragPhotoX0 = photoX; dragPhotoY0 = photoY;
      } else if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (!photoImg) return;
      if (e.touches.length === 1 && isDragging) {
        const p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
        photoX = dragPhotoX0 + (p.x - dragStartX);
        photoY = dragPhotoY0 + (p.y - dragStartY);
      } else if (e.touches.length === 2 && lastTouchDist) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        photoScale = Math.max(0.05, Math.min(20, photoScale * (d / lastTouchDist)));
        lastTouchDist = d;
        syncSlider();
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

    // Auto-load demo
    setTimeout(() => {
      if (!templateImg) loadDemo();
    }, 700);
  </script>
</body>
</html>
